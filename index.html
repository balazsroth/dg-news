<style>
/* Világos alapértelmezés, sötét mód kapcsolóval (data-dg-theme). Layout: nyomtatott magazin; piacsáv, egy kiemelt + három vízszintes kártya, alatta hírlista és közelgő választások */
:root{
  --paper:#F4F1EA; --card:#FFFFFF; --ink:#16161A; --muted:#6B6A66; --line:#E2DDD2; --soft:#ECE7DC;
  --blue:#23408E; --verm:#E4462B; --green:#2F7A5B; --ochre:#D69A2D; --ochre-ink:#1A1405; --cream:#EFE7D6;
  --focus:#E4462B; --up:#1E7A4C; --down:#C2331C;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
  --sans:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --gutter:40px;
  color-scheme:light;
}
:root[data-dg-theme="dark"]{
  --paper:#141416; --card:#1D1D21; --ink:#F2EFE8; --muted:#A9A69F; --line:#2E2D30; --soft:#26252A;
  --focus:#FF6A4F; --up:#4CC38A; --down:#FF7A63; color-scheme:dark;
}
html,body{background:var(--paper);color:var(--ink)}
h2,h3,p,ul{margin:0}
*,*::before,*::after{box-sizing:border-box}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased}

.wrap{max-width:1280px;margin:0 auto;padding-block:48px 64px;
  padding-left:max(var(--gutter), env(safe-area-inset-left,0px));
  padding-right:max(var(--gutter), env(safe-area-inset-right,0px));}

/* fejléc */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px 40px;padding-bottom:28px;border-bottom:1px solid var(--ink)}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--verm)}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--verm)}
.h2{font-family:var(--serif);font-weight:500;font-size:clamp(40px,5vw,68px);line-height:1.02;letter-spacing:-.025em;margin-top:10px;text-wrap:balance}
.h2 em{font-style:italic;color:var(--muted)}
.tools{display:flex;align-items:center;justify-content:flex-end;gap:10px;min-width:0;flex:none;max-width:100%}
.pills{display:flex;flex-wrap:nowrap;gap:10px;min-width:0}
.pill{flex:none}
.pill{height:40px;padding:0 18px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);font:500 15px/1 var(--sans);white-space:nowrap;cursor:pointer;transition:background .3s var(--ease),color .3s var(--ease),border-color .3s var(--ease)}
.pill:hover{border-color:var(--ink)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.theme{flex:none;display:inline-grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);cursor:pointer;transition:border-color .3s var(--ease),background .3s var(--ease)}
.theme:hover{border-color:var(--ink)}
.theme svg{width:18px;height:18px;display:block}
.all{display:inline-flex;align-items:center;gap:6px;font:600 15px/1 var(--sans);color:var(--ink);text-decoration:none;white-space:nowrap;padding:10px 4px;background:none;border:0;cursor:pointer}
.all span{transition:transform .3s var(--ease)}
.all:hover span{transform:translateY(3px)}
.all[aria-expanded="true"] span{transform:rotate(180deg)}
.sec-toggle{margin-top:14px;padding:10px 0}
/* ha csak ezt olvasod el */
.must{margin-top:24px;padding:22px 26px 24px;background:var(--card);border-radius:20px;border-left:6px solid var(--verm);animation:rise .9s var(--ease) backwards;animation-delay:40ms}
.must-h{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--verm)}
.must-h::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--verm)}
.must-list{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 36px}
.must-list li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.must-n{font-family:var(--serif);font-size:28px;line-height:1;color:var(--verm);font-variant-numeric:tabular-nums}
.must-a{color:var(--ink);text-decoration:none;font-size:15.5px;line-height:1.5}
.must-a strong{font-weight:700}
.must-a:hover{text-decoration:underline;text-decoration-color:var(--muted);text-underline-offset:3px}
.must-src{display:block;margin-top:4px;font-size:12.5px;color:var(--muted)}
.must-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.must-x{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);font:600 13px/1 var(--sans);cursor:pointer;transition:border-color .3s var(--ease),color .3s var(--ease)}
.must-x:hover{border-color:var(--ink);color:var(--ink)}
.must-wrap{display:grid;grid-template-rows:1fr;margin-top:24px;transition:grid-template-rows .5s var(--ease),margin-top .5s var(--ease)}
.must-wrap.out{grid-template-rows:0fr;margin-top:0}
.must-in{min-height:0;overflow:hidden}
.must-wrap .must{margin-top:0}
.must-wrap.out .must{animation:mustOut .4s var(--ease) forwards}
@keyframes mustOut{to{opacity:0;transform:translateY(-10px)}}

/* cikknézet */
.rd-back{position:fixed;inset:0;z-index:50;display:grid;justify-items:center;align-items:start;overflow-y:auto;padding:40px 16px;background:rgba(10,10,12,.58);animation:fade .25s var(--ease)}
.rd{position:relative;width:min(780px,100%);background:var(--card);color:var(--ink);border-radius:20px;overflow:hidden;box-shadow:0 30px 80px -30px rgba(0,0,0,.55);animation:rise .5s var(--ease);outline:none}
.rd-cover{aspect-ratio:16/9}
.rd-body{display:flex;flex-direction:column;gap:16px;padding:26px 34px 30px}
.rd-t{font-family:var(--serif);font-weight:500;font-size:clamp(26px,3.2vw,38px);line-height:1.12;letter-spacing:-.015em;text-wrap:balance}
.rd-text{display:flex;flex-direction:column;gap:14px;font-size:16.5px;line-height:1.68;color:var(--ink);max-width:68ch}
.rd-foot{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-top:6px;padding-top:18px;border-top:1px solid var(--line)}
.rd-go{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 20px;border-radius:12px;background:var(--ink);color:var(--paper);font:600 15px/1 var(--sans);text-decoration:none;white-space:nowrap}
.rd-go:hover{opacity:.88}
.rd-note{font-size:12.5px;color:var(--muted)}
.rd-x{position:absolute;top:12px;right:12px;z-index:3;display:grid;place-items:center;width:42px;height:42px;border:0;border-radius:999px;background:rgba(255,255,255,.9);color:#16161A;font:400 26px/1 var(--sans);cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (max-width:1024px){ .must-list{grid-template-columns:1fr} }
@media (max-width:640px){
  .must{padding:18px 18px 20px}
  .rd-back{padding:0}
  .rd{border-radius:0;min-height:100%}
  .rd-body{padding:20px 20px 32px}
  .rd-go{width:100%;justify-content:center}
}


/* piacsáv */
.markets{display:grid;grid-template-columns:1fr;gap:10px;padding:16px 0;border-bottom:1px solid var(--line);animation:rise .9s var(--ease) backwards;animation-delay:60ms}
.mk-h{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.mk-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.mk-note{font-size:12px;line-height:1.45;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;min-width:0}
.tile{background:var(--card);border-radius:12px;padding:10px 12px;min-width:0}
.tile .n{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.tile .v{font-size:17px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:2px}
.tile .c{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:1px}
.tile .c.up{color:var(--up)} .tile .c.down{color:var(--down)} .tile .c.flat{color:var(--muted)}

/* választások */
.elx{margin-top:28px}
.elx h4{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin:0 0 10px}
.elx ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.elx li{position:relative;display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.elx .day{font-family:var(--serif);font-size:26px;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.elx .mon{display:block;font-family:var(--sans);font-size:11px;font-weight:600;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.06em}
.elx .ct{font-weight:600;font-size:14px}
.elx .ct a{color:var(--ink);text-decoration:none}
.elx .ct a::after{content:"";position:absolute;inset:0}
.elx .ty{font-size:13px;color:var(--muted)}
.elx .cd{color:var(--verm);font-weight:600}

/* rács */
.grid{display:grid;grid-template-columns:1.35fr 1fr;grid-template-rows:repeat(3,auto);gap:24px;margin-top:28px}
.card{position:relative;background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 1px 0 rgba(22,22,26,.04);
  transition:transform .5s var(--ease),box-shadow .5s var(--ease),filter .4s var(--ease),opacity .4s var(--ease);
  animation:rise .9s var(--ease) backwards;animation-delay:calc(var(--i,0) * 110ms)}
.card:hover{transform:translateY(-3px);box-shadow:0 24px 50px -24px rgba(22,22,26,.28)}
.card.dim{filter:grayscale(1);opacity:.32}
.feat{display:flex;flex-direction:column}
.swap{animation:rise .6s var(--ease) backwards}
.stale{margin-top:16px;padding:10px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:14px}
.empty{color:var(--muted);font-size:15px;padding:24px 0}
.small{display:grid;grid-template-columns:42% 1fr;min-height:170px}
.head{animation:rise .9s var(--ease) backwards}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

/* borító */
.cover{position:relative;overflow:hidden;background:var(--soft);min-width:0}
.feat .cover{aspect-ratio:16/8;max-width:100%}
@media (min-width:1025px){.feat .cover{aspect-ratio:auto;flex:1 1 auto;min-height:clamp(260px,26vw,380px)} .feat .body{flex:none}}
.art{position:absolute;inset:0;transition:transform 1s var(--ease)}
.card:hover .art,.card:hover .ph,.row:hover .ph,.row:hover .art{transform:scale(1.07)}
.ph{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;display:block;transition:transform 1s var(--ease);background:var(--soft)}
.credit{position:absolute;right:10px;bottom:10px;z-index:1;padding:3px 8px;border-radius:6px;background:rgba(10,10,12,.62);color:#fff;font-size:11px;line-height:1.3;pointer-events:none}
.art svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.small .who{flex-wrap:wrap;row-gap:4px}
.small .who .date{white-space:nowrap}
.sum,.rsum{display:flex;flex-direction:column;gap:8px;color:var(--muted)}
.sum{font-size:14px;line-height:1.55}
.sum:not(.open) p:first-child{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.excerpt{display:flex;flex-direction:column;gap:10px}
.expand{position:relative;z-index:3;align-self:flex-start;display:inline-flex;align-items:center;gap:6px;margin-top:2px;padding:6px 0;border:0;background:none;color:var(--ink);font:600 13px/1.2 var(--sans);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.expand:hover{text-decoration-color:currentColor}
.art span{position:absolute;display:block}

/* blocks: papírívek és hengerek hosszú árnyékkal */
.art.blocks{background:linear-gradient(118deg,#E9DCC4 0%,#E1D1B4 48%,#D7C4A3 100%)}
.art.blocks::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(118deg,rgba(255,255,255,.0) 0 9%,rgba(60,40,10,.10) 9% 15%,rgba(255,255,255,0) 15% 24%)}
.art.blocks::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12%;background:#CDB894}
.blocks .a1{left:14%;bottom:12%;width:30%;height:74%;background:#F0E6D3;border-radius:999px 999px 0 0;box-shadow:inset -10px 0 0 rgba(0,0,0,.06)}
.blocks .a1i{left:21%;bottom:12%;width:16%;height:52%;background:#D9C7A6;border-radius:999px 999px 0 0}
.blocks .a2{left:46%;bottom:12%;width:24%;height:56%;background:#1E2A44;border-radius:999px 999px 0 0}
.blocks .a2i{left:52%;bottom:12%;width:12%;height:36%;background:#D7C4A3;border-radius:999px 999px 0 0}
.blocks .c1{left:6%;bottom:8%;width:10%;height:38%;background:#22345E;border-radius:6px 6px 2px 2px;box-shadow:inset -8px 0 0 rgba(0,0,0,.18)}
.blocks .c2{left:34%;bottom:7%;width:9%;height:30%;background:#F3EBDD;border-radius:6px 6px 2px 2px;box-shadow:inset -8px 0 0 rgba(0,0,0,.08)}
.blocks .c3{left:72%;bottom:12%;width:7%;height:66%;background:#EFE5D2;border-radius:6px 6px 0 0;box-shadow:inset -6px 0 0 rgba(0,0,0,.07)}
.blocks .q1{left:63%;bottom:7%;width:26%;height:24%;background:#D69A2D;border-radius:999px 999px 0 0;box-shadow:inset -12px 0 0 rgba(0,0,0,.12)}
.blocks .c4{left:86%;bottom:9%;width:8%;height:36%;background:#22345E;border-radius:6px 6px 2px 2px;box-shadow:inset -6px 0 0 rgba(0,0,0,.18)}

/* orbit: kék alapon egymásba ágyazott körök + okker csepp */
.art.orbit{background:var(--blue)}
.orbit .r1{width:118%;aspect-ratio:1;left:-58%;top:50%;transform:translateY(-50%);border-radius:50%;background:var(--verm)}
.orbit .r2{width:76%;aspect-ratio:1;left:-38%;top:50%;transform:translateY(-50%);border-radius:50%;background:#F1EADB}
.orbit .r3{width:30%;aspect-ratio:1;left:0;top:0;border-radius:0 0 999px 0;background:#16161A}
.orbit .drop{width:34%;aspect-ratio:1;right:10%;bottom:12%;border-radius:0 50% 50% 50%;background:var(--ochre)}

/* arch: zöld és krém csíkok előtt fekete boltív vermilion sávval */
.art.arch{background:repeating-linear-gradient(90deg,var(--green) 0 14px,#EDE6D6 14px 28px)}
.arch .ar{left:18%;width:64%;bottom:20%;height:56%;background:#16161A;border-radius:999px 999px 0 0}
.arch .band{left:18%;width:64%;bottom:12%;height:10%;background:var(--verm)}

/* split: átlós sík, kör és sáv */
.art.split{background:linear-gradient(135deg,var(--green) 0 50%,#EDE6D6 50% 100%)}
.split .dot{width:46%;aspect-ratio:1;left:27%;top:50%;transform:translateY(-50%);border-radius:50%;background:#16161A}
.split .bar{left:10%;right:10%;bottom:14%;height:9%;background:var(--ochre)}
.split .tiny{width:12%;aspect-ratio:1;right:9%;top:12%;border-radius:50%;background:var(--verm)}

/* grid: okker alap, pontrács, negyedkör */
.art.dots{background-color:var(--ochre);background-image:radial-gradient(#1A1405 1.6px,transparent 1.8px);background-size:16px 16px}
.dots .qc{width:70%;aspect-ratio:1;right:-20%;bottom:-30%;border-radius:50%;background:#EDE6D6}
.dots .sq{width:22%;aspect-ratio:1;left:12%;top:16%;background:var(--blue)}

/* wave: vermilion koncentrikus ívek */
.art.wave{background:repeating-radial-gradient(circle at 0% 100%,#EDE6D6 0 12px,var(--verm) 12px 26px)}
.wave .sun{width:30%;aspect-ratio:1;right:12%;top:14%;border-radius:50%;background:#16161A}

/* címkék */
.tag{display:inline-flex;align-items:center;padding:5px 11px;border-radius:999px;font:700 12px/1.2 var(--sans);color:#fff;letter-spacing:.01em}
.tag.ochre{color:var(--ochre-ink)}
.badges{position:absolute;inset:16px 16px auto 16px;display:flex;justify-content:space-between;z-index:1;pointer-events:none}
.glass{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font:600 13px/1.2 var(--sans);color:#16161A}

/* kártya szöveg */
.body{display:flex;flex-direction:column;gap:14px;min-width:0}
.feat .body{padding:24px 30px 26px;flex:1}
.small .body{padding:20px 22px}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.meta .sep{width:3px;height:3px;border-radius:50%;background:var(--muted)}
.title{font-family:var(--serif);font-weight:500;letter-spacing:-.015em;line-height:1.12;text-wrap:balance;color:var(--ink)}
.feat .title{font-size:clamp(26px,2.2vw,32px)}
.small .title{font-size:22px}
.title a{color:inherit;text-decoration:none}
.title a::after{content:"";position:absolute;inset:0;z-index:2;border-radius:20px}
.title .u{background-image:linear-gradient(currentColor,currentColor);background-repeat:no-repeat;background-position:0 100%;background-size:0% 1px;transition:background-size .5s var(--ease);padding-bottom:2px}
.card:hover .title .u,.title a:focus-visible .u{background-size:100% 1px}
.excerpt{font-size:16px;line-height:1.6;color:var(--muted);max-width:62ch}
.foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:18px;border-top:1px solid var(--line)}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.av{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 12px/1 var(--sans);color:#fff}
.av.ochre{color:var(--ochre-ink)}
.small .av{width:30px;height:30px}
.av.logo{background:#fff;border:1px solid var(--line);overflow:hidden}
.av.logo img{width:70%;height:70%;object-fit:contain;display:block}
.av.sm{width:18px;height:18px;font-size:8px}
.av.sm.logo img{width:80%;height:80%}
.rsrc{display:inline-flex;align-items:center;gap:6px}
.name{font-weight:600;font-size:15px;color:var(--ink)}
.role{font-size:13px;color:var(--muted);margin-top:2px}
.small .who{margin-top:auto;font-size:14px}
.small .who .date{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;background:var(--paper);color:var(--ink);font:600 15px/1 var(--sans);white-space:nowrap;transition:background .4s var(--ease),color .4s var(--ease)}
.btn .arr{transition:transform .4s var(--ease)}
.feat:hover .btn{background:var(--ink);color:var(--paper)}
.feat:hover .btn .arr{transform:translateX(3px)}

/* további hírek */
